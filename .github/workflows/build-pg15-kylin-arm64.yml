name: "Build PostgreSQL 15.17 RPM (Kylin V10 SP3 / aarch64)"

# ─────────────────────────────────────────────────────────────────────────────
# 按 PGDG 官方布局打包：前缀 /usr/pgsql-15、数据目录 /var/lib/pgsql/15/data、
# postgresql-15-setup initdb、10 子包结构。
# 源码用官方 release tarball（含预生成 man 页），spec 为参数化的 postgresql.spec。
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "Release 后缀，写入 Release: 1<dist_tag>"
        required: true
        default: ".ky10"
        type: string
      upload_release:
        description: "构建成功后创建 GitHub Release"
        required: true
        default: true
        type: boolean
      allow_unpackaged:
        description: "调试用：容忍未打包文件（仅用于校准 %files，禁止用于发布）"
        required: true
        default: false
        type: boolean
      base_image:
        description: "构建容器镜像（默认麒麟 V10 SP3）"
        required: true
        default: "hxsoong/kylin:v10-sp3"
        type: string

permissions:
  contents: write

concurrency:
  group: build-pg15-ky10-${{ github.ref }}
  cancel-in-progress: false

env:
  PGVERSION: "15.17"
  PGMAJOR: "15"
  SRC_NAME: postgresql-15.17
  SRC_TARBALL_NAME: postgresql-15.17.tar.bz2
  SRC_TARBALL: /var/cache/pgsrc/postgresql-15.17.tar.bz2
  SPEC_FILE: postgresql.spec
  DIST_TAG: ${{ github.event.inputs.dist_tag || '.ky10' }}
  BUILD_FLAVOR: kylin
  RPMBUILD_TOP: /build/rpmbuild
  TARGET_NAME: "Kylin V10 SP3 (aarch64)"
  GLIBC_MAX: "2.28"
  EXPECT_ARCH: "aarch64"
  ARCH_HINT: "ARM aarch64"

jobs:
  build:
    name: rpmbuild (aarch64 / rockylinux8)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    container:
      image: ${{ github.event.inputs.base_image }}
      options: --user root

    steps:
      - name: 环境自检
        shell: bash
        run: |
          echo "arch      : $(uname -m)"
          echo "cpu       : $(nproc)"
          echo "disk      :"; df -h / /tmp | sed 's/^/            /'
          echo "memory    :"; free -h 2>/dev/null | sed 's/^/            /' || :
          cat /etc/kylin-release 2>/dev/null || cat /etc/os-release

      - name: 检出打包工程（spec + scripts）
        uses: actions/checkout@v4
        with:
          path: pkg
          fetch-depth: 1
          persist-credentials: false

      - name: 缓存源码包
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/pgsrc
          key: pg15-ky10-${{ runner.arch }}-pgsrc-dnf-v1

      - name: 安装构建依赖（含下载源码包）
        shell: bash
        run: bash pkg/scripts/prepare-build-env.sh

      - name: 构建 RPM（source + binary + debuginfo）
        shell: bash
        env:
          ALLOW_UNPACKAGED: ${{ github.event.inputs.allow_unpackaged == 'true' && '1' || '0' }}
        run: bash pkg/scripts/build-rpm.sh

      - name: 校验产物（架构 / glibc / debuginfo / systemd 单元）
        shell: bash
        run: bash pkg/scripts/verify-rpm.sh

      - name: 归档构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-pg15-ky10
          path: |
            ${{ env.RPMBUILD_TOP }}/build.log
            ${{ env.RPMBUILD_TOP }}/BUILD/postgresql-15.17/buildroot-files.txt
          if-no-files-found: warn
          retention-days: 7

      - name: 上传 RPM 产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgresql-15.17-kylin-v10-sp3-aarch64-rpms
          path: |
            ${{ env.RPMBUILD_TOP }}/RPMS/**/*.rpm
            ${{ env.RPMBUILD_TOP }}/SRPMS/*.rpm
            ${{ env.RPMBUILD_TOP }}/SHA256SUMS
            ${{ env.RPMBUILD_TOP }}/BUILD-INFO.txt
          if-no-files-found: warn
          retention-days: 30

  release:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: github.event.inputs.upload_release == 'true'
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          name: postgresql-15.17-kylin-v10-sp3-aarch64-rpms
          path: dist

      - name: 生成 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ format('postgresql-15.17-1.ky10-{0}', github.run_number) }}
        run: |
          set -e
          find dist -name '*.rpm' | sort
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "PostgreSQL 15.17 for Kylin V10 SP3 (aarch64)" \
            --notes-file dist/BUILD-INFO.txt \
            $(find dist -name '*.rpm' -o -name 'SHA256SUMS' | sort) \
          || gh release upload "$TAG" $(find dist -name '*.rpm' -o -name 'SHA256SUMS' | sort) --clobber
